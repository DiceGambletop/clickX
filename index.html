<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickX Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-logo">DICE GAMBLETOP</a>
    </div>
  </nav>

  <!-- Fixed counter -->
  <div id="counter-display">Clicks: 0</div>

  <!-- Main content -->
  <article>
    <h1>ClickX Universe</h1>
    <button id="clickBtn" class="click-button">Click me</button>

    <!-- Upgrade section -->
    <div class="upgrade-container">
      <h2>Upgrades</h2>
      <button id="upgradeSlight" class="upgrade-button">
        Slight Improvement (+80% per purchase) — Cost: 25 Clicks
      </button>
      <button id="upgradeCompound" class="upgrade-button">
        Compounding Results (x1.2 compounding, doubles each purchase) — Cost: 250 Clicks
      </button>
    </div>
  </article>

  <script src="script.js"></script>
</body>
</html>
