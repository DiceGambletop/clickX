<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickX Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-logo">DICE GAMBLETOP</a>
    </div>
  </nav>

  <!-- Main content -->
  <article>
    <h1 id="display">Clicks: 0</h1>
    <button id="clickBtn" class="click-button">Click me</button>
  </article>

  <!-- Script -->
  <script>
    let clicks = 0;
    const button = document.getElementById("clickBtn");
    const display = document.getElementById("display");

    button.addEventListener("click", () => {
      clicks += 1;
      display.textContent = "Clicks: " + clicks;
    });
  </script>

</body>
</html>
