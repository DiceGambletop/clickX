<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickX Counter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-container">
      <a href="/" class="nav-logo">DICE GAMBLETOP</a>
    </div>
  </nav>

  <!-- Fixed counter (top-left, below navbar) -->
  <div id="counter-display">Clicks: 0</div>

  <!-- Main content -->
  <article>
    <h1>ClickX Universe</h1>
    <button id="clickBtn" class="click-button">Click me</button>

    <!-- Upgrade section -->
    <div class="upgrade-container">
      <button id="upgradeBtn" class="upgrade-button">
        Slight Improvement (+100% Clicks)
      </button>
    </div>
  </article>

  <script src="script.js"></script>
</body>
</html>
